modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Drehverschluss/Stormcaller/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Drehverschluss/Stormcaller"
authors="${mod_authors}"
# Pixel art icon: keep it sharp in the mod list
logoFile="stormcaller_logo.png"
logoBlur=false
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

# Only applied when Pufferfish's Skills is installed (see SkillsMixinPlugin)
[[mixins]]
config="${mod_id}.skills.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Spell Engine pulls in Cloth Config and playerAnimator as its own required dependencies
    modId="spell_engine"
    type="required"
    versionRange="${spell_engine_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Lightning school, spell power attributes (comes with Spell Engine)
    modId="spell_power"
    type="required"
    versionRange="${spell_power_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Wizards pulls in Runes and Structure Pool API as its own required dependencies
    modId="wizards"
    type="required"
    versionRange="${wizards_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Robe models (comes with Wizards)
    modId="armor_model_api"
    type="required"
    versionRange="${armor_model_api_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: the Stormcaller skill tab
    modId="skill_tree_rpgs"
    type="optional"
    versionRange="${skill_tree_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: the skill tab runs on Pufferfish's Skills (comes with Skill Tree)
    modId="puffish_skills"
    type="optional"
    versionRange="${puffish_skills_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: rings, amulets and relics (Curios slots ring, necklace, spell_trinket); without Curios they do not exist
    modId="curios"
    type="optional"
    versionRange="${curios_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: the roll passives of the skill tab (Static Trap, Charged Roll) are triggered by a combat roll
    modId="combat_roll"
    type="optional"
    versionRange="${combat_roll_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: the Amber Lightning Staff (item and recipe) only exists with Better End
    modId="betterend"
    type="optional"
    versionRange="${betterend_version_range}"
    ordering="NONE"
    side="BOTH"
