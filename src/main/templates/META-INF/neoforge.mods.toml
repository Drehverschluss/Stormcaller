modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Drehverschluss/Stormcaller/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Drehverschluss/Stormcaller"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Spell Engine pulls in Spell Power, Cloth Config and playerAnimator as its own required dependencies
    modId="spell_engine"
    type="required"
    versionRange="${spell_engine_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Wizards pulls in Runes, Armor Model API and Structure Pool API as its own required dependencies
    modId="wizards"
    type="required"
    versionRange="${wizards_version_range}"
    ordering="AFTER"
    side="BOTH"
