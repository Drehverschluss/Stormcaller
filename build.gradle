plugins {
    id 'java-library'
    id 'maven-publish'
    // Forge 1.20.1 through ModDevGradle Legacy (BP1)
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 runs on Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

// --- Parts of the 1.21.1 sources that are not ported yet (nothing deleted, only left out of the build) ---
// BP5: skill tree (compat/skilltree, mixin/skills, built-in skill tree data pack)
def notPortedYet = [
        'com/drehverschluss/stormcaller/compat/skilltree/**',
        'com/drehverschluss/stormcaller/mixin/skills/**',
        // BP4: HUD of Stored Charge (IClientMobEffectExtensions through RegisterClientExtensionsEvent on 1.21.1)
        'com/drehverschluss/stormcaller/fx/client/StoredChargeHud.java',
]
def notPortedYetResources = [
        'resourcepacks/skill_tree/**',
        'stormcaller.skills.mixins.json',
]

sourceSets.main {
    java {
        exclude notPortedYet
    }
    resources {
        exclude notPortedYetResources
        // Exclude common development only resources from finalized outputs
        exclude '**/*.bbmodel'
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // No dev runs: the RPG Series jars for 1.20.1 ship without refmaps and crash in a named (Mojang) dev environment.
    // Server checks run on a real Forge server, see the task setupProdServer / Konzept (run-prod/).

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    // Mixin annotation processor writes the refmap (SRG names for Minecraft targets)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // MixinExtras (@WrapOperation): compile against common, ship the Forge build jar-in-jar (MIT)
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    jarJar(implementation("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        version {
            strictly "[${mixinextras_version},)"
            prefer mixinextras_version
        }
    }

    // RPG Series and optional mods: compile only, never bundled (remapped from SRG to Mojang names by MDG Legacy)
    modCompileOnly("maven.modrinth:spell-engine:${spell_engine_version}") { transitive = false }
    modCompileOnly("maven.modrinth:spell-power:${spell_power_version}") { transitive = false }
    modCompileOnly("maven.modrinth:wizards:${wizards_version}") { transitive = false }
    modCompileOnly("maven.modrinth:armor-model-api:${armor_model_api_version}") { transitive = false }
    modCompileOnly("maven.modrinth:tiny-config:${tiny_config_version}") { transitive = false }
    modCompileOnly("maven.modrinth:curios:${curios_version}") { transitive = false }
    // BP5: skill tree
    modCompileOnly("maven.modrinth:skill-tree:${skill_tree_version}") { transitive = false }
    modCompileOnly("maven.modrinth:skills:${puffish_skills_version}") { transitive = false }
}

// Expands the properties below in src/main/templates (META-INF/mods.toml)
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version            : minecraft_version,
            minecraft_version_range      : minecraft_version_range,
            forge_version_range          : forge_version_range,
            loader_version_range         : loader_version_range,
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_license                  : mod_license,
            mod_version                  : mod_version,
            mod_authors                  : mod_authors,
            mod_description              : mod_description,
            spell_engine_version_range   : spell_engine_version_range,
            wizards_version_range        : wizards_version_range,
            skill_tree_version_range     : skill_tree_version_range,
            curios_version_range         : curios_version_range,
            spell_power_version_range    : spell_power_version_range,
            armor_model_api_version_range: armor_model_api_version_range,
            puffish_skills_version_range : puffish_skills_version_range,
            combat_roll_version_range    : combat_roll_version_range,
            betterend_version_range      : betterend_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    // Ship the MIT license text in the root of the jar.
    from('LICENSE')
    // Forge 1.20.1 reads the mixin configs from the manifest ([[mixins]] in mods.toml only exists on NeoForge)
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
