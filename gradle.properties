# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment mappings for 1.20.1: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
# Forge for 1.20.1 (recommended build): https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
forge_version=47.4.28
forge_version_range=[47.4,)
# The loader version range can only use the major version of FML (47 for 1.20.1) as bounds
loader_version_range=[47,)

## Dependencies (Forge 1.20.1 builds, compiled against Modrinth Maven, never bundled)
# Spell Engine (required), https://modrinth.com/mod/spell-engine
spell_engine_version=1.10.10+1.20.1-forge
spell_engine_version_range=[1.10.10,)
# Spell Power Attributes (required), https://modrinth.com/mod/spell-power
spell_power_version=1.6.1+1.20.1-forge
spell_power_version_range=[1.6.1,)
# Wizards (RPG Series) (required), https://modrinth.com/mod/wizards
wizards_version=3.1.3+1.20.1-forge
wizards_version_range=[3.1.3,)
# Armor Model API (required, comes with Wizards), https://modrinth.com/mod/armor-model-api
armor_model_api_version=1.0.0+1.20.1-forge
armor_model_api_version_range=[1.0.0,)
# tiny_config (shipped jar-in-jar by Spell Engine), https://modrinth.com/mod/tiny-config
tiny_config_version=3.1.0+1.20.1-forge
# Skill Tree (RPG Series) (optional, skill tree port in BP5), https://modrinth.com/mod/skill-tree
skill_tree_version=1.6.2+1.20.1-forge
skill_tree_version_range=[1.6.2,)
# Pufferfish's Skills (optional, comes with Skill Tree), Modrinth version id of 0.19.2 for Forge 1.20: https://modrinth.com/mod/skills
puffish_skills_version=zfbPzmtb
puffish_skills_version_range=[0.19.2,)
# Curios API (optional): rings, amulets and relics only exist with Curios. https://modrinth.com/mod/curios
curios_version=5.14.1+1.20.1
curios_version_range=[5.14,)
# Combat Roll (optional, data only, mod id combatroll on 1.20.1): roll passives of the skill tab. https://modrinth.com/mod/combat-roll
combat_roll_version_range=[1.3.3,)
# BetterEnd: Before Dawn (optional, data only, mod id betterend): Amber Lightning Staff. https://modrinth.com/mod/betterend-forge
betterend_version_range=[20.0.13,)
# MixinExtras (@WrapOperation), shipped jar-in-jar: https://github.com/LlamaLad7/MixinExtras
mixinextras_version=0.5.5

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=stormcaller
# The human-readable display name for the mod.
mod_name=Stormcaller (RPG Series Plus)
# The license of the mod.
mod_license=MIT
# The mod version, RPG Series style: <version>+<minecraft version>
mod_version=0.4.1+1.20.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
mod_group_id=com.drehverschluss.stormcaller
# The authors of the mod, displayed in the mod UI.
mod_authors=Drehverschluss
# The description of the mod, displayed in the mod UI.
mod_description=Stormcaller (RPG Series Plus) adds Lightning as a fourth school of magic to Wizards: eight lightning spells that jump between enemies and shock them, robes from tier 2 to 4, wands, staves and a spell book. With Curios API there are lightning rings, amulets and relics, and with Skill Tree (RPG Series) a Stormcaller skill tab.
