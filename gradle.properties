# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.265
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Dependencies
# Spell Engine (required, compile-only), Modrinth Maven version: https://modrinth.com/mod/spell-engine
spell_engine_version=1.10.9+1.21.1-neoforge
spell_engine_version_range=[1.10.9,)
# Spell Power API (compile-only), Modrinth Maven version: https://modrinth.com/mod/spell-power
spell_power_version=1.6.0+1.21.1-neoforge
spell_power_version_range=[1.6.0,)
# Wizards (RPG Series) (required, compile-only), Modrinth Maven version: https://modrinth.com/mod/wizards
wizards_version=3.1.3+1.21.1-neoforge
wizards_version_range=[3.1.3,)
# Armor Model API (compile-only, shipped with Wizards), Modrinth Maven version: https://modrinth.com/mod/armor-model-api
armor_model_api_version=1.1.0+1.21.1-neoforge
armor_model_api_version_range=[1.1.0,)
# tiny_config (compile-only, shipped jar-in-jar by Spell Engine), Modrinth Maven version: https://modrinth.com/mod/tiny-config
tiny_config_version=3.1.0-neoforge
# Skill Tree (RPG Series) (optional, compile-only), Modrinth Maven version: https://modrinth.com/mod/skill-tree
skill_tree_version=1.6.1+1.21.1-neoforge
skill_tree_version_range=[1.6.1,)
# Pufferfish's Skills (optional, compile-only, pulled in by Skill Tree), Modrinth version id of 0.19.2 for NeoForge: https://modrinth.com/mod/skills
puffish_skills_version=8tfcI2wU
puffish_skills_version_range=[0.19.2,)
# Curios API (optional, compile-only): rings, amulets and relics only exist with Curios. https://modrinth.com/mod/curios
curios_version=9.5.1+1.21.1
curios_version_range=[9.5.1,)
# Combat Roll (optional, data only): the roll passives of the skill tab use its ROLL trigger. https://modrinth.com/mod/combat-roll
combat_roll_version_range=[2.0.6,)
# Better End (optional, data only): the recipe and item of the Amber Lightning Staff need it. https://modrinth.com/mod/betterend
betterend_version_range=[21.0.39,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=stormcaller
# The human-readable display name for the mod.
mod_name=Stormcaller (RPG Series Plus)
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=0.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.drehverschluss.stormcaller
# The authors of the mod, displayed in the mod UI.
mod_authors=Drehverschluss
# The description of the mod, displayed in the mod UI.
mod_description=Stormcaller (RPG Series Plus) adds Lightning as a fourth school of magic to Wizards: eight lightning spells that jump between enemies and shock them, robes from tier 2 to 4, wands, staves and a spell book. With Curios API there are lightning rings, amulets and relics, and with Skill Tree (RPG Series) a Stormcaller skill tab.
